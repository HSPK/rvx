[build-system]
requires = ["maturin>=1.12.1,<2"]
build-backend = "maturin"

[project]
name = "rvx"
version = "0.1.0"
description = "Full-state snapshot SDK, native observability server, CLI, and Web UI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "hspk" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/HSPK/rvx"
Repository = "https://github.com/HSPK/rvx"
Issues = "https://github.com/HSPK/rvx/issues"

[project.optional-dependencies]
aiohttp = ["aiohttp>=3.12,<4"]

[project.scripts]
rvx = "rvx.cli:main"
rvxd = "rvx.cli:daemon_main"

[dependency-groups]
dev = [
  "maturin>=1.12.1,<2",
  "aiohttp>=3.12,<4",
  "starlette>=0.40,<1",
  "httpx>=0.28,<1",
]

[tool.maturin]
manifest-path = "rust/rvx-python/Cargo.toml"
python-source = "src"
module-name = "rvx._native"
bindings = "pyo3"
locked = true
include = [
  { path = "rvx/_bin/rvxd", format = "wheel" },
  { path = "rvx/_web/**/*", format = "wheel" },
]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-toolchain.toml" },
  { file = "rust/**/Cargo.toml" },
  { file = "rust/**/*.rs" },
  { file = "src/rvx/**/*.py" },
  { file = "src/rvx/_bin/rvxd" },
  { file = "src/rvx/_web/**/*" },
  { file = "scripts/package_assets.py" },
  { file = "LICENSE" },
  { file = "THIRD_PARTY_NOTICES.md" },
  { file = "README.md" },
  { env = "RUSTFLAGS" },
  { env = "PYO3_PYTHON" },
]
