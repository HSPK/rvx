name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      TMPDIR: ${{ github.workspace }}/.build
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p .build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: cargo test --locked --workspace
      - run: uv sync --locked
      - run: cargo build --locked --release -p rvx-server
      - run: uv run python -m unittest discover -s tests -v
        env:
          RVXD_BINARY: ${{ github.workspace }}/target/release/rvxd
      - run: uv run rvx --help
      - run: uv run python scripts/release_version.py

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
